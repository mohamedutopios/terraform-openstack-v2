# =============================================================================
# Pipeline d'un MODULE Terraform (dépôt terraform-openstack-*)
#
# Inclus par le .gitlab-ci.yml de chaque module :
#   include:
#     - project: mohamed.aijjou1780/terraform-ci-templates
#       ref: v1.0.0
#       file: templates/module.yml
#
# Variables attendues côté module : MODULE_NAME, MODULE_SYSTEM.
#
#   MR / branche  : qualité + tests + sécurité
#   tag vX.Y.Z    : idem + contrôle du tag + Release GitLab + registre
#
# Aucun job n'a besoin d'OpenStack : runners partagés suffisants.
# =============================================================================

variables:
  TF_VERSION: "1.16.7"
  TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.64.0
  # Depuis la 0.21, l'image n'est publiée que par architecture
  TFDOCS_IMAGE: quay.io/terraform-docs/terraform-docs:0.24.0-amd64
  CHECKOV_IMAGE: bridgecrew/checkov:3.4.2
  KICS_IMAGE: checkmarx/kics:v2.1.21
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${CI_PROJECT_DIR}/.tf-plugin-cache

stages:
  - qualite
  - test
  - securite
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    # Pas de doublon branche + MR
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.terraform:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  before_script:
    - mkdir -p "${TF_PLUGIN_CACHE_DIR}"
  cache:
    key: tf-providers-${TF_VERSION}
    paths:
      - .tf-plugin-cache/

# ----------------------------------------------------------------- qualite ---

fmt:
  extends: .terraform
  stage: qualite
  script:
    - terraform fmt -check -recursive -diff

# Le module annonce "required_version >= 1.5" : on le prouve en validant
# avec la plus ancienne ET la plus récente version supportées.
validate:
  extends: .terraform
  stage: qualite
  parallel:
    matrix:
      - TF_VERSION: ["1.5.7", "1.16.7"]
  script:
    - terraform init -backend=false
    - terraform validate
    - |
      for ex in examples/*/; do
        echo "--- validate ${ex}"
        terraform -chdir="${ex}" init -backend=false
        terraform -chdir="${ex}" validate
      done

tflint:
  stage: qualite
  image:
    name: ${TFLINT_IMAGE}
    entrypoint: [""]
  script:
    # --recursive : le module ET ses exemples, avec la même configuration
    - tflint --recursive --config "${CI_PROJECT_DIR}/.tflint.hcl" -f junit > tflint.xml || true
    - tflint --recursive --config "${CI_PROJECT_DIR}/.tflint.hcl" -f compact
  artifacts:
    when: always
    reports:
      junit: tflint.xml

# La doc (entrées/sorties) est générée depuis le code : le job échoue si
# quelqu'un a modifié une variable sans relancer terraform-docs.
docs:
  stage: qualite
  image:
    name: ${TFDOCS_IMAGE}
    entrypoint: [""]
  script:
    - terraform-docs --output-check .

# -------------------------------------------------------------------- test ---

# Tests unitaires (tests/*.tftest.hcl) : provider simulé, aucun cloud.
terraform-test:
  extends: .terraform
  stage: test
  script:
    - terraform init -backend=false
    - terraform test -junit-xml=terraform-test.xml
  artifacts:
    when: always
    reports:
      junit: terraform-test.xml


# ---------------------------------------------------------------- securite ---

# Analyse statique du code (module + exemples)
checkov:
  stage: securite
  needs: []
  image:
    name: ${CHECKOV_IMAGE}
    entrypoint: [""]
  script:
    - checkov -d . --config-file .checkov.yaml -o cli -o junitxml --output-file-path console,checkov.xml
  artifacts:
    when: always
    reports:
      junit: checkov.xml


# Second moteur (requêtes Rego) ; rapport au format SAST de GitLab
kics:
  stage: securite
  needs: []
  image:
    name: ${KICS_IMAGE}
    entrypoint: [""]
  script:
    - /app/bin/kics scan -p "${CI_PROJECT_DIR}" --ci --no-progress
      --exclude-paths "${CI_PROJECT_DIR}/.tf-plugin-cache"
      --report-formats json,glsast -o "${CI_PROJECT_DIR}/kics"
      --fail-on high,medium
  artifacts:
    when: always
    paths:
      - kics/
    reports:
      sast: kics/gl-sast-results.json

# ----------------------------------------------------------------- release ---

# Un tag = une promesse. On refuse un tag hors SemVer ou absent du CHANGELOG.
verifier-tag:
  stage: release
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      echo "${CI_COMMIT_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
        || { echo "Tag ${CI_COMMIT_TAG} invalide : attendu vMAJEUR.MINEUR.CORRECTIF"; exit 1; }
    - |
      grep -q "^## \[${VERSION}\]" CHANGELOG.md \
        || { echo "CHANGELOG.md ne contient pas de section ## [${VERSION}]"; exit 1; }
    # Notes de version = la section du CHANGELOG correspondant au tag
    - awk -v v="${VERSION}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes-de-version.md
    - cat notes-de-version.md
  artifacts:
    paths:
      - notes-de-version.md

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [verifier-tag]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Release ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: "${MODULE_NAME} ${CI_COMMIT_TAG}"
    description: notes-de-version.md

# Optionnel : publie aussi le module dans le registre Terraform de GitLab
# (consommable par  source = "gitlab.com/<namespace>/<nom>/<systeme>"
#  + version = "~> 2.0"). Les consommateurs par git::...?ref= n'en ont pas besoin.
publier-registre:
  stage: release
  image: alpine:3.22
  needs: [verifier-tag]
  rules:
    - if: $CI_COMMIT_TAG && $MODULE_NAME && $MODULE_SYSTEM
  script:
    - apk add --no-cache curl
    - tar -czf /tmp/module.tgz --exclude=./.git --exclude=./.tf-plugin-cache .
    - |
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file /tmp/module.tgz \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/terraform/modules/${MODULE_NAME}/${MODULE_SYSTEM}/${CI_COMMIT_TAG#v}/file"
